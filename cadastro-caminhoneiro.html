<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Cadastro Caminhoneiro | FreteHub</title><link rel="stylesheet" href="css/auth.css"/></head><body><main class="auth-page"><section class="auth-card wide"><a class="back" href="index.html">&larr; Voltar</a><h1>Cadastro de caminhoneiro</h1><p>Crie seu perfil para receber fretes, cadastrar veiculos e construir reputacao.</p><form id="registerDriverForm" class="grid-form"><div><label for="name">Nome completo</label><input id="name" required/></div><div><label for="phone">WhatsApp</label><input id="phone" type="tel" required/></div><div><label for="document">CPF ou CNPJ</label><input id="document" required/></div><div><label for="cnh">CNH</label><input id="cnh" required/></div><div><label for="baseState">Estado base</label><select id="baseState" required><option>Carregando...</option></select></div><div><label for="baseCity">Cidade base</label><select id="baseCity" required disabled><option>Selecione o estado</option></select></div><div><label for="email">E-mail</label><input id="email" type="email" required/></div><div><label for="password">Senha</label><input id="password" type="password" minlength="6" required/></div><label class="span-2 check-line"><input id="driverTerms" type="checkbox" required/> Aceito que os dados liberados de cada frete sao exclusivos para a operacao autorizada e que a negociacao deve respeitar a intermediacao registrada pela plataforma.</label><button type="submit">Criar cadastro</button></form><p id="message" class="message"></p></section></main><script type="module" src="js/auth.js"></script></body></html>
