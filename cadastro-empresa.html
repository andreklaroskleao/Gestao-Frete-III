<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Cadastro Empresa | FreteHub</title><link rel="stylesheet" href="css/auth.css"/></head><body><main class="auth-page"><section class="auth-card wide"><a class="back" href="index.html">&larr; Voltar</a><h1>Cadastro de empresa</h1><p>Crie o acesso para publicar cargas, aprovar caminhoneiros e acompanhar operacoes.</p><form id="registerCompanyForm" class="grid-form"><div><label for="companyName">Empresa</label><input id="companyName" required/></div><div><label for="contactName">Responsavel</label><input id="contactName" required/></div><div><label for="companyPhone">WhatsApp</label><input id="companyPhone" type="tel" required/></div><div><label for="cnpj">CNPJ</label><input id="cnpj" required/></div><div><label for="baseState">Estado</label><select id="baseState" required><option>Carregando...</option></select></div><div><label for="baseCity">Cidade</label><select id="baseCity" required disabled><option>Selecione o estado</option></select></div><div><label for="email">E-mail</label><input id="email" type="email" required/></div><div><label for="password">Senha</label><input id="password" type="password" minlength="6" required/></div><label class="span-2 check-line"><input id="commissionAccept" type="checkbox" required/> Ao utilizar a plataforma e aprovar caminhoneiros indicados, a empresa reconhece a intermediacao do FreteHub e concorda com a comissao definida para cada operacao.</label><button type="submit">Criar acesso da empresa</button></form><p id="message" class="message"></p></section></main><script type="module" src="js/auth.js"></script></body></html>
